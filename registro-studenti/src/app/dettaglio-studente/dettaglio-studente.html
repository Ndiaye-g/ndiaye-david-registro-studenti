@if (studente(); as s) {
<h2>Scheda dello studente</h2>
<app-studente-card [studente]="s" (rimosso)="rimuovi($event)" />
<div class="mt-3">
<a class="btn btn-outline-secondary" routerLink="/elenco">Torna all'elenco</a>
<button type="button" class="btn btn-primary ms-2" (click)="successivo()">Studente
successivo</button>
</div>
}
<td class="text-end">
<a class="btn btn-sm btn-outline-primary" [routerLink]="['/elenco',

s.id]">Dettaglio</a>

<button type="button" class="btn btn-sm btn-outline-danger ms-1"

(click)="rimuovi(s.id)">Elimina</button>

</td>
